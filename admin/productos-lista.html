<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX Admin | Mantenedor de Productos</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Externo -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

  <div class="d-flex min-vh-100">

    <!-- SIDEBAR -->
    <aside class="bg-white border-end d-flex flex-column p-3" style="width: 260px; min-width: 260px;">
      <a href="index.html" class="d-flex align-items-center text-dark text-decoration-none fw-bold fs-4 text-uppercase mb-4 px-2 tracking-wider">
        <i class="bi bi-lightning-charge-fill text-danger me-2"></i>Sport<span class="text-danger">X</span>
      </a>

      <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
          <a href="index.html" class="nav-link text-secondary">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="productos-lista.html" class="nav-link active bg-danger text-white">
            <i class="bi bi-box-seam me-2"></i>Productos
          </a>
        </li>
        <li class="nav-item" id="menu-usuarios-item">
          <a href="usuarios-lista.html" class="nav-link text-secondary">
            <i class="bi bi-people me-2"></i>Usuarios
          </a>
        </li>
        <li class="nav-item">
          <a href="../index.html" class="nav-link text-secondary" target="_blank">
            <i class="bi bi-shop me-2"></i>Ir a la Tienda
          </a>
        </li>
      </ul>

      <hr>
      <div class="small text-muted px-2">
        SportX Chile Backoffice v1.0
      </div>
    </aside>

    <!-- CONTENIDO CENTRAL -->
    <main class="flex-grow-1 p-4 overflow-auto">
      
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 pb-3 mb-4 border-bottom">
        <div>
          <h1 class="h3 fw-bold text-dark mb-1">Inventario de Productos</h1>
          <p class="text-muted small mb-0">Gestión de stock, precios y umbrales de stock crítico</p>
        </div>
        <div>
          <a href="producto-form.html" class="btn btn-danger shadow-sm fw-semibold" id="btn-nuevo-prod">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Producto
          </a>
        </div>
      </div>

      <!-- TABLA DE PRODUCTOS -->
      <section class="card border-0 shadow-sm rounded-4 bg-white p-4">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 small" id="tabla-productos">
            <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Stock Crítico</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-productos">
              <!-- Renderizado dinámico -->
            </tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <!-- DEPENDENCIAS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. RBAC
      const sesionRaw = localStorage.getItem("sportx_session");
      if (!sesionRaw) {
        window.location.href = "../login.html";
        return;
      }
      const sesion = JSON.parse(sesionRaw);
      if (sesion.rol === "Cliente") {
        window.location.href = "../index.html";
        return;
      }
      if (sesion.rol === "Vendedor") {
        const itemU = document.getElementById("menu-usuarios-item");
        if (itemU) itemU.style.display = "none";
      }

      // 2. Cargar productos
      renderizarTablaProductos();
    });

    function obtenerListaProductos() {
      const guardados = localStorage.getItem("sportx_products");
      if (guardados) return JSON.parse(guardados);
      localStorage.setItem("sportx_products", JSON.stringify(PRODUCTOS_INICIALES));
      return PRODUCTOS_INICIALES;
    }

    function renderizarTablaProductos() {
      const prods = obtenerListaProductos();
      const tbody = document.getElementById("tbody-productos");
      tbody.innerHTML = "";

      prods.forEach((p, index) => {
        const esCritico = p.stock <= p.stockCritico;
        const claseFila = esCritico ? "table-warning" : "";
        const precioTxt = p.precio === 0 ? "FREE" : `$${p.precio.toLocaleString("es-CL")}`;

        const badgeEstado = esCritico
          ? `<span class="badge bg-danger"><i class="bi bi-exclamation-triangle me-1"></i>Crítico</span>`
          : `<span class="badge bg-success">Normal</span>`;

        const fila = `
          <tr class="${claseFila}">
            <td class="fw-bold">${p.codigo || p.id}</td>
            <td>
              <img src="${p.imagen}" class="rounded border" style="width: 42px; height: 42px; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=100&q=80'">
            </td>
            <td class="fw-semibold text-dark">${p.nombre}</td>
            <td><span class="badge bg-light text-dark border">${p.categoria}</span></td>
            <td class="fw-bold ${p.precio === 0 ? 'text-success' : 'text-danger'}">${precioTxt}</td>
            <td><strong>${p.stock}</strong></td>
            <td>${p.stockCritico}</td>
            <td>${badgeEstado}</td>
            <td class="text-end">
              <a href="producto-form.html?id=${p.id}" class="btn btn-sm btn-outline-secondary me-1" title="Editar"><i class="bi bi-pencil"></i></a>
              <button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarProducto(${index})" title="Eliminar"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        `;
        tbody.innerHTML += fila;
      });
    }

    function eliminarProducto(index) {
      if (confirm("¿Estás seguro de que deseas eliminar este producto del catálogo?")) {
        const prods = obtenerListaProductos();
        prods.splice(index, 1);
        localStorage.setItem("sportx_products", JSON.stringify(prods));
        renderizarTablaProductos();
      }
    }
  </script>
</body>
</html>
