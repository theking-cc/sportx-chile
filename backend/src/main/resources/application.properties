spring.application.name=sportx-api
server.port=${SERVER_PORT:8080}

# Conexión a MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/sportx_db_v2
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Las tablas ya están creadas mediante SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

sportx.jwt.secret=${SPORTX_JWT_SECRET}
sportx.jwt.expiration-minutes=60

# Usuarios iniciales - solo desarrollo
sportx.seed.enabled=${SPORTX_SEED_ENABLED:false}
sportx.seed.admin-password=${SPORTX_ADMIN_PASSWORD:}
sportx.seed.vendedor-password=${SPORTX_VENDEDOR_PASSWORD:}

# Diagnóstico temporal
logging.level.sportx_api=DEBUG
logging.level.org.springframework.web=DEBUG
# Inicio de sesión con Google (OpenID Connect).
# GOOGLE_CLIENT_ID: ID de cliente OAuth "Aplicación web" de Google Cloud Console.
sportx.google.client-id=${GOOGLE_CLIENT_ID:}
sportx.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}

# Orígenes del frontend permitidos por CORS (separados por coma).
sportx.cors.allowed-origins=${SPORTX_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Pagos con Transbank Webpay Plus.
# Ambiente: integracion (pruebas, por defecto) | produccion | simulado (sin internet).
# Las credenciales por defecto son las PÚBLICAS de integración de Transbank.
sportx.webpay.ambiente=${WEBPAY_AMBIENTE:integracion}
sportx.webpay.codigo-comercio=${WEBPAY_CODIGO_COMERCIO:597055555532}
sportx.webpay.api-key=${WEBPAY_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
# URL pública del frontend: Transbank devuelve al comprador a FRONTEND_URL/api/v1/pagos/webpay/retorno
sportx.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.document-title=SportX Chile API
