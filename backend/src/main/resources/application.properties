spring.application.name=sportx-api
server.port=8080

# Conexión a MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/sportx_db_v2
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Las tablas ya están creadas mediante SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

sportx.jwt.secret=${SPORTX_JWT_SECRET}
sportx.jwt.expiration-minutes=60

# Usuarios iniciales - solo desarrollo
sportx.seed.enabled=${SPORTX_SEED_ENABLED:false}
sportx.seed.admin-password=${SPORTX_ADMIN_PASSWORD:}
sportx.seed.vendedor-password=${SPORTX_VENDEDOR_PASSWORD:}

# Diagnóstico temporal
logging.level.sportx_api=DEBUG
logging.level.org.springframework.web=DEBUG